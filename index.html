  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Počúvam Rádiá</title>  <!-- Google Cast Web Sender SDK -->  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>  <style>

    main {

    .controls {

    .control-button:hover {

    .favorite-button {

    .favorite-button.active {

    .cast-button {

    .program-box {

    .program-row {

    .program-row:last-child {
      border-bottom: 0;
    }

    .program-time {
      font-weight: bold;
    }

    .program-name {
      font-weight: bold;
    }

    .program-radio-name {
      font-size: 12px;
      color: #777;
      margin-top: 3px;
    }

    @media (max-width: 600px) {
      .player {
        padding: 22px 16px;
      }

      .radio-logo {
        width: 105px;
        height: 105px;
      }

      .radio-name {
        font-size: 23px;
      }

      .side-menu {
        width: 320px;
      }
    }
  </style></head><body><header>

  <h2>Menu</h2>  <section class="menu-section">

<form onsubmit="addMyRadio(event)">

    id="myRadioName"

  <input

  <input

  www.bauermedia.sk

<div class="now-playing">

  <div class="now-label">
    Práve hrá
  </div>

  <div
    id="songTitle"
    class="song-title">
    Načítavam...
  </div>

  <div
    id="artist"
    class="artist">
  </div>

</div>

<div class="controls">

  <button
    id="playButton"
    class="control-button"
    type="button"
    onclick="togglePlay()"
    aria-label="Prehrať alebo pozastaviť">

  </button>

  <button
    id="favoriteButton"

  </button>

  <button

  </section></main><section
  id="programSection"
  class="program-section"
  style="max-width:900px;margin:0 auto 30px;padding:0 15px;">  <div
    style="background:white;border-radius:20px;padding:25px;box-shadow:0 8px 30px rgba(0,0,0,.08);"><h2 style="margin-top:0;">
  📅 Program
</h2>

<label for="programDate">

  id="programDate"

  style="margin-top:8px;max-width:220px;"

  id="programContent"

  </div></section><footer>
  Počúvam Rádiá
</footer><script>
  const radios = [
    {
      id: "expres",
      name: "Rádio Expres",
      stream: "https://stream.bauermedia.sk/expres-hi.mp3",
      web: "https://www.bauermedia.sk",
      logo: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRObKScNrVH6CHuGgHAglR-ZjGL0Crgp6whWV5GNDMzqQ&s=10",
      recommended: true
    },
    {
      id: "melody",
      name: "Rádio Melody",
      stream: "https://stream.bauermedia.sk/melody-hi.mp3",
      web: "https://www.bauermedia.sk",
      logo: "",
      recommended: true
    }
  ];

  const programs = {
    "expres": {
      "2026-09-06": [
        {
          time: "06:00",
          name: "Ranná šou"
        },
        {
          time: "09:00",
          name: "Dopoludnie"
        },
        {
          time: "12:00",
          name: "Expres popoludnie"
        },
        {
          time: "15:00",
          name: "Popoludňajšie vysielanie"
        },
        {
          time: "18:00",
          name: "Večer na Exprese"
        }
      ]
    },

    "melody": {
      "2026-09-06": [
        {
          time: "06:00",
          name: "Ranné Melody"
        },
        {
          time: "10:00",
          name: "Dopoludnie s Melody"
        },
        {
          time: "14:00",
          name: "Popoludnie"
        },
        {
          time: "18:00",
          name: "Večer s Melody"
        }
      ]
    }
  };

  let currentRadio = radios[0];

  let favorites =
    JSON.parse(
      localStorage.getItem(
        "pocuvam_favorites"
      ) || "[]"
    );

  let myRadios =
    JSON.parse(
      localStorage.getItem(
        "pocuvam_my_radios"
      ) || "[]"
    );

  let suggestions =
    JSON.parse(
      localStorage.getItem(
        "pocuvam_suggestions"
      ) || "[]"
    );

  let metadataTimer = null;

  const METADATA_SERVER =
    "https://jaroacjak.github.io/pocuvamradio/metadata.php";

  const audioPlayer =
    document.getElementById(
      "audioPlayer"
    );

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function escapeJs(value) {
    return String(value ?? "")
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'");
  }

  function toggleSideMenu() {
    document
      .getElementById("sideMenu")
      .classList.add("open");

    document
      .getElementById("menuOverlay")
      .classList.add("open");
  }

  function closeSideMenu() {
    document
      .getElementById("sideMenu")
      .classList.remove("open");

    document
      .getElementById("menuOverlay")
      .classList.remove("open");
  }

  /*
   * Táto funkcia zostáva kvôli kompatibilite
   * s existujúcim tlačidlom.
   *
   * cast.js ju po načítaní nahradí
   * skutočným Google Cast ovládaním.
   */
  function googleCastPreparing() {
    const message =
      document.getElementById(
        "castMessage"
      );

    message.textContent =
      "Google Cast pripravujeme.";

    setTimeout(() => {
      message.textContent = "";
    }, 4000);
  }

  function loadRadio(radio) {
    if (!radio) return;

    currentRadio = radio;

    /*
     * Odovzdanie aktuálneho rádia do Castu.
     *
     * Ak Cast nie je pripojený, iba sa uloží
     * aktuálne rádio a pri pripojení sa použije.
     */
    if (
      window.PocuvamRadiaCast &&
      typeof window.PocuvamRadiaCast.setRadio ===
        "function"
    ) {
      window.PocuvamRadiaCast.setRadio(
        radio
      );
    }

    if (metadataTimer) {
      clearInterval(metadataTimer);
      metadataTimer = null;
    }

    audioPlayer.pause();

    audioPlayer.src =
      radio.stream;

    audioPlayer.load();

    document
      .getElementById("radioName")
      .textContent =
      radio.name;

    const logo =
      document.getElementById(
        "radioLogo"
      );

    if (radio.logo) {
      logo.src = radio.logo;
      logo.style.display =
        "inline-block";
    } else {
      logo.removeAttribute("src");
      logo.style.display = "none";
    }

    const web =
      document.getElementById(
        "radioWeb"
      );

    if (radio.web) {
      web.href = radio.web;

      web.textContent =
        radio.web.replace(
          /^https?:\/\//,
          ""
        );

      web.style.display =
        "inline-block";
    } else {
      web.style.display = "none";
    }

    document
      .getElementById("songTitle")
      .textContent =
      "Načítavam...";

    document
      .getElementById("artist")
      .textContent = "";

    document
      .getElementById("playerStatus")
      .textContent =
      "Pripravené";

    document
      .getElementById("castMessage")
      .textContent = "";

    updateFavoriteButton();
    renderAllMenu();
    startMetadata();
  }

  function togglePlay() {
    if (audioPlayer.paused) {

      audioPlayer
        .play()
        .then(() => {

          document
            .getElementById(
              "playButton"
            )
            .textContent =
            "❚❚";

          document
            .getElementById(
              "playerStatus"
            )
            .textContent =
            "Prehráva sa";

        })
        .catch(() => {

          document
            .getElementById(
              "playerStatus"
            )
            .textContent =
            "Stream sa nepodarilo spustiť";

        });

    } else {

      audioPlayer.pause();

      document
        .getElementById(
          "playButton"
        )
        .textContent =
        "▶";

      document
        .getElementById(
          "playerStatus"
        )
        .textContent =
        "Pozastavené";
    }
  }

  audioPlayer.addEventListener(
    "play",
    () => {

      document
        .getElementById(
          "playButton"
        )
        .textContent =
        "❚❚";

      document
        .getElementById(
          "playerStatus"
        )
        .textContent =
        "Prehráva sa";
    }
  );

  audioPlayer.addEventListener(
    "pause",
    () => {

      document
        .getElementById(
          "playButton"
        )
        .textContent =
        "▶";
    }
  );

  audioPlayer.addEventListener(
    "error",
    () => {

      document
        .getElementById(
          "playerStatus"
        )
        .textContent =
        "Chyba pri prehrávaní streamu";
    }
  );

  function changeVolume(value) {
    audioPlayer.volume =
      Number(value);
  }

  function isFavorite(id) {
    return favorites.some(
      radio =>
        radio.id === id
    );
  }

  function toggleFavorite() {

    const index =
      favorites.findIndex(
        radio =>
          radio.id ===
          currentRadio.id
      );

    if (index >= 0) {

      favorites.splice(
        index,
        1
      );

    } else {

      favorites.push(
        currentRadio
      );
    }

    localStorage.setItem(
      "pocuvam_favorites",
      JSON.stringify(
        favorites
      )
    );

    updateFavoriteButton();
    renderFavorites();
  }

  function updateFavoriteButton() {

    const button =
      document.getElementById(
        "favoriteButton"
      );

    if (
      isFavorite(
        currentRadio.id
      )
    ) {

      button.textContent =
        "♥";

      button.classList.add(
        "active"
      );

    } else {

      button.textContent =
        "♡";

      button.classList.remove(
        "active"
      );
    }
  }

  function removeFavorite(id) {

    favorites =
      favorites.filter(
        radio =>
          radio.id !== id
      );

    localStorage.setItem(
      "pocuvam_favorites",
      JSON.stringify(
        favorites
      )
    );

    renderFavorites();
    updateFavoriteButton();
  }

  function renderRadioList() {

    const container =
      document.getElementById(
        "radioList"
      );

    container.innerHTML = "";

    radios.forEach(
      radio => {

        const button =
          document.createElement(
            "button"
          );

        button.type = "button";

        button.className =
          "radio-item" +
          (
            currentRadio.id ===
            radio.id
              ? " active"
              : ""
          );

        button.innerHTML = `
          <span class="item-title">
            📻 ${escapeHtml(radio.name)}
          </span>

          <span class="item-small">
            Kliknutím počúvať
          </span>
        `;

        button.onclick = () => {
          selectRadio(radio);
        };

        container.appendChild(
          button
        );
      }
    );
  }

  function renderRecommended() {

    const container =
      document.getElementById(
        "recommendedList"
      );

    container.innerHTML = "";

    const recommended =
      radios.filter(
        radio =>
          radio.recommended
      );

    if (!recommended.length) {

      container.innerHTML =
        '<div class="empty">Žiadne odporúčané rádiá.</div>';

      return;
    }

    recommended.forEach(
      radio => {

        const button =
          document.createElement(
            "button"
          );

        button.type = "button";
        button.className =
          "recommended-item";

        button.innerHTML = `
          <span class="item-title">
            ⭐ ${escapeHtml(radio.name)}
          </span>
        `;

        button.onclick = () => {
          selectRadio(radio);
        };

        container.appendChild(
          button
        );
      }
    );
  }

  function renderFavorites() {

    const container =
      document.getElementById(
        "favoritesList"
      );

    container.innerHTML = "";

    if (!favorites.length) {

      container.innerHTML =
        '<div class="empty">Zatiaľ nemáš obľúbené rádio.</div>';

      return;
    }

    favorites.forEach(
      radio => {

        const wrapper =
          document.createElement(
            "div"
          );

        wrapper.className =
          "favorite-item";

        wrapper.innerHTML = `
          <div
            onclick="selectMyRadio('${escapeJs(radio.id)}')"
            style="cursor:pointer;">

            <span class="item-title">
              📡 ${escapeHtml(radio.name)}
            </span>

            <span class="item-small">
              Vlastné rádio
            </span>

          </div>

          <button
            class="danger-button"
            type="button"
            onclick="deleteMyRadio('${escapeJs(radio.id)}')">
            Odstrániť
          </button>
        `;

        container.appendChild(
          wrapper
        );
      }
    );
  }

  function selectMyRadio(id) {

    const radio =
      myRadios.find(
        item =>
          item.id === id
      );

    if (radio) {
      selectRadio(radio);
    }
  }

  function renderAllMenu() {
    renderRadioList();
    renderRecommended();
    renderFavorites();
    renderMyRadios();
  }

  function selectRadio(radio) {
    loadRadio(radio);
    closeSideMenu();
  }

  function addMyRadio(event) {

    event.preventDefault();

    const name =
      document
        .getElementById(
          "myRadioName"
        )
        .value
        .trim();

    const stream =
      document
        .getElementById(
          "myRadioStream"
        )
        .value
        .trim();

    const web =
      document
        .getElementById(
          "myRadioWeb"
        )
        .value
        .trim();

    if (!name || !stream) {
      return;
    }

    const radio = {

      id:
        "my-" +
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .slice(2),

      name,
      stream,
      web,
      logo: "",
      recommended: false,
      custom: true
    };

    myRadios.push(
      radio
    );

    localStorage.setItem(
      "pocuvam_my_radios",
      JSON.stringify(
        myRadios
      )
    );

    document
      .getElementById(
        "myRadioName"
      )
      .value = "";

    document
      .getElementById(
        "myRadioStream"
      )
      .value = "";

    document
      .getElementById(
        "myRadioWeb"
      )
      .value = "";

    renderMyRadios();

    selectRadio(radio);
  }

  function deleteMyRadio(id) {

    myRadios =
      myRadios.filter(
        radio =>
          radio.id !== id
      );

    localStorage.setItem(
      "pocuvam_my_radios",
      JSON.stringify(
        myRadios
      )
    );

    renderMyRadios();

    if (
      currentRadio.id === id
    ) {
      loadRadio(
        radios[0]
      );
    }
  }

  function suggestRadio(event) {

    event.preventDefault();

    const name =
      document
        .getElementById(
          "suggestName"
        )
        .value
        .trim();

    const stream =
      document
        .getElementById(
          "suggestStream"
        )
        .value
        .trim();

    const web =
      document
        .getElementById(
          "suggestWeb"
        )
        .value
        .trim();

    const note =
      document
        .getElementById(
          "suggestNote"
        )
        .value
        .trim();

    if (!name || !stream) {
      return;
    }

    suggestions.push({

      id: Date.now(),

      name,

      stream,

      web,

      note,

      date:
        new Date()
          .toISOString()
    });

    localStorage.setItem(
      "pocuvam_suggestions",
      JSON.stringify(
        suggestions
      )
    );

    document
      .getElementById(
        "suggestName"
      )
      .value = "";

    document
      .getElementById(
        "suggestStream"
      )
      .value = "";

    document
      .getElementById(
        "suggestWeb"
      )
      .value = "";

    document
      .getElementById(
        "suggestNote"
      )
      .value = "";

    document
      .getElementById(
        "suggestMessage"
      )
      .textContent =
      "Návrh bol uložený.";

    document
      .getElementById(
        "suggestMessage"
      )
      .style.color =
      "green";
  }

  function showProgram() {

    const date =
      document
        .getElementById(
          "programDate"
        )
        .value;

    const container =
      document.getElementById(
        "programContent"
      );

    if (!date) {

      container.innerHTML =
        "Vyber dátum programu.";

      return;
    }

    const radioProgram =
      programs[
        currentRadio.id
      ];

    if (
      !radioProgram ||
      !radioProgram[date]
    ) {

      container.innerHTML =
        "Pre toto rádio a tento dátum program zatiaľ nie je dostupný.";

      return;
    }

    const entries =
      radioProgram[date];

    if (!entries.length) {

      container.innerHTML =
        "Program pre tento deň nie je dostupný.";

      return;
    }

    container.innerHTML =
      entries
        .map(
          item => `

            <div class="program-row">

              <div class="program-time">
                ${escapeHtml(item.time)}
              </div>

              <div>

                <div class="program-name">
                  ${escapeHtml(item.name)}
                </div>

                <div class="program-radio-name">
                  ${escapeHtml(currentRadio.name)}
                </div>

              </div>

            </div>
          `
        )
        .join("");
  }

  async function loadMetadata() {

    if (!currentRadio) {
      return;
    }

    try {

      const url =
        METADATA_SERVER +
        "?radio=" +
        encodeURIComponent(
          currentRadio.id
        ) +
        "&t=" +
        Date.now();

      const response =
        await fetch(
          url,
          {
            cache:
              "no-store"
          }
        );

      if (!response.ok) {
        throw new Error(
          "Metadata server error"
        );
      }

      const data =
        await response.json();

      const title =
        data.title || "";

      const artist =
        data.artist || "";

      if (title) {

        document
          .getElementById(
            "songTitle"
          )
          .textContent =
          title;
      }

      document
        .getElementById(
          "artist"
        )
        .textContent =
        artist;

      /*
       * Ak je Cast aktívny, aktualizujeme
       * aj názov skladby na Cast zariadení.
       */
      if (
        window.PocuvamRadiaCast &&
        typeof window.PocuvamRadiaCast.updateMetadata ===
          "function"
      ) {

        window.PocuvamRadiaCast.updateMetadata(
          title,
          artist
        );

      }

    } catch (error) {

      /*
        GitHub Pages PHP nespúšťa.
        METADATA_SERVER musí byť neskôr
        umiestnený na PHP hostingu.
      */
    }
  }

  function startMetadata() {

    loadMetadata();

    metadataTimer =
      setInterval(
        loadMetadata,
        10000
      );
  }

  function initializeApp() {

    audioPlayer.volume = 1;

    document
      .getElementById(
        "programDate"
      )
      .value =
      "2026-09-06";

    loadRadio(
      radios[0]
    );

    showProgram();

    renderAllMenu();
  }

  initializeApp();
</script>

<script src="cast.js"></script>
