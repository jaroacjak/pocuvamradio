<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Počúvam Rádiá</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    header h1 {
      margin: 0;
      font-size: 21px;
    }

    #menuBtn {
      border: 0;
      background: #333;
      color: white;
      font-size: 25px;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 15px;
    }

    .player {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
      text-align: center;
    }

    .logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      border-radius: 15px;
      margin-bottom: 10px;
    }

    .no-logo {
      width: 120px;
      height: 120px;
      border-radius: 15px;
      background: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 10px;
      font-size: 45px;
    }

    #radioName {
      margin: 8px 0;
      font-size: 25px;
    }

    #status {
      color: #666;
      margin: 5px 0 15px;
    }

    .song {
      background: #f5f5f5;
      padding: 14px;
      border-radius: 12px;
      margin: 15px 0;
    }

    #songTitle {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    #artistName {
      color: #666;
      font-size: 16px;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    .control-btn {
      border: 0;
      background: #111;
      color: white;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }

    .control-btn:hover {
      background: #333;
    }

    .favorite-btn {
      background: #e5e5e5;
      color: #111;
    }

    .favorite-btn.active {
      background: #ffd43b;
    }

    .volume {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 15px;
      justify-content: center;
    }

    .volume input {
      width: 180px;
    }

    .website {
      margin-top: 12px;
    }

    .website a {
      color: #0066cc;
      text-decoration: none;
    }

    section {
      background: white;
      margin-top: 20px;
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    section h2 {
      margin-top: 0;
    }

    #radioMenu {
      display: none;
      background: white;
      border-radius: 14px;
      margin-top: 12px;
      padding: 10px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    }

    .radio-item {
      width: 100%;
      border: 0;
      background: #f3f3f3;
      padding: 13px;
      margin-bottom: 8px;
      border-radius: 10px;
      text-align: left;
      cursor: pointer;
      font-size: 16px;
    }

    .radio-item:hover {
      background: #ddd;
    }

    .radio-item:last-child {
      margin-bottom: 0;
    }

    .recommended-list,
    .favorites-list {
      display: grid;
      gap: 10px;
    }

    .card {
      background: #f5f5f5;
      padding: 14px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .card-name {
      font-weight: bold;
    }

    .card-actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .small-btn {
      border: 0;
      background: #111;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 15px;
    }

    .form-group textarea {
      min-height: 90px;
      resize: vertical;
    }

    .submit-btn {
      border: 0;
      background: #111;
      color: white;
      padding: 12px 18px;
      border-radius: 9px;
      cursor: pointer;
    }

    .empty {
      color: #777;
      text-align: center;
      padding: 10px;
    }

    .program-day {
      margin-bottom: 15px;
    }

    .program-day h3 {
      margin-bottom: 8px;
    }

    .program-item {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 9px;
      margin-bottom: 6px;
    }

    .program-time {
      font-weight: bold;
      margin-right: 8px;
    }

    .date-picker {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 30px 15px;
    }

    @media (max-width: 600px) {
      main {
        padding: 10px;
      }

      .player {
        padding: 15px;
      }

      header h1 {
        font-size: 18px;
      }

      #radioName {
        font-size: 22px;
      }

      .card {
        flex-direction: column;
        align-items: stretch;
      }

      .card-actions {
        width: 100%;
      }

      .small-btn {
        flex: 1;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>📻 Počúvam Rádiá</h1>
  <button id="menuBtn" onclick="toggleRadioMenu()">☰</button>
</header>

<main>

  <!-- PREHRÁVAČ -->
  <div class="player">

    <div id="logoContainer">
      <div class="no-logo">📻</div>
    </div>

    <h2 id="radioName">Rádio Expres</h2>

    <div id="status">Pripravené</div>

    <div class="song">
      <div id="songTitle">Názov skladby sa načíta automaticky</div>
      <div id="artistName">Interpret</div>
    </div>

    <div class="website" id="websiteContainer"></div>

    <div class="controls">
      <button class="control-btn" id="playBtn" onclick="togglePlay()">
        ▶️ Prehrať
      </button>

      <button class="control-btn favorite-btn" id="favoriteBtn" onclick="toggleFavorite()">
        ☆ Obľúbené
      </button>
    </div>

    <div class="volume">
      🔊
      <input
        type="range"
        id="volume"
        min="0"
        max="1"
        step="0.01"
        value="1"
        oninput="changeVolume()"
      >
    </div>

    <audio id="audio" preload="none"></audio>

  </div>

  <!-- MENU RÁDIÍ -->
  <div id="radioMenu">
    <h3>📻 Rádiá</h3>
    <div id="radioList"></div>
  </div>

  <!-- ODPORÚČANÉ -->
  <section>
    <h2>⭐ Odporúčané</h2>
    <div id="recommendedList" class="recommended-list"></div>
  </section>

  <!-- OBĽÚBENÉ -->
  <section>
    <h2>❤️ Obľúbené</h2>
    <div id="favoritesList" class="favorites-list"></div>
  </section>

  <!-- MOJE RÁDIÁ -->
  <section>
    <h2>📻 Moje rádiá</h2>

    <div id="myRadiosList"></div>

    <hr>

    <h3>Pridať rádio</h3>

    <form onsubmit="addMyRadio(event)">

      <div class="form-group">
        <label for="myRadioName">Názov rádia</label>
        <input id="myRadioName" required>
      </div>

      <div class="form-group">
        <label for="myRadioStream">Stream URL</label>
        <input id="myRadioStream" type="url" required>
      </div>

      <div class="form-group">
        <label for="myRadioWeb">Web rádia – voliteľné</label>
        <input id="myRadioWeb" type="url">
      </div>

      <button class="submit-btn" type="submit">
        ➕ Pridať rádio
      </button>

    </form>
  </section>

  <!-- NAVRHNÚŤ RÁDIO -->
  <section>
    <h2>💡 Navrhnúť rádio</h2>

    <form onsubmit="suggestRadio(event)">

      <div class="form-group">
        <label for="suggestName">Názov rádia</label>
        <input id="suggestName" required>
      </div>

      <div class="form-group">
        <label for="suggestStream">Stream URL</label>
        <input id="suggestStream" type="url" required>
      </div>

      <div class="form-group">
        <label for="suggestWeb">Web – voliteľné</label>
        <input id="suggestWeb" type="url">
      </div>

      <div class="form-group">
        <label for="suggestNote">Poznámka – voliteľné</label>
        <textarea id="suggestNote"></textarea>
      </div>

      <button class="submit-btn" type="submit">
        📤 Odoslať návrh
      </button>

    </form>

    <div id="suggestionMessage"></div>
  </section>

  <!-- PROGRAM -->
  <section>
    <h2>📅 Program</h2>

    <label for="programDate">Vyber dátum:</label>

    <input
      type="date"
      id="programDate"
      class="date-picker"
      onchange="showProgram()"
    >

    <div id="programTitle"></div>
    <div id="programContent"></div>
  </section>

</main>

<footer>
  📻 Počúvam Rádiá
</footer>

<script>

  /*
    ============================================================
    RÁDIÁ
    ============================================================
  */

  const radios = [

    {
      id: "expres",
      name: "Rádio Expres",
      stream: "https://stream.bauermedia.sk/expres-hi.mp3",
      web: "https://www.bauermedia.sk",
      logo: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRObKScNrVH6CHuGgHAglR-ZjGL0Crgp6whWV5GNDMzqQ&s=10",
      recommended: true
    },

    {
      id: "melody",
      name: "Rádio Melody",
      stream: "https://stream.bauermedia.sk/melody-hi.mp3",
      web: "https://www.bauermedia.sk",
      logo: "",
      recommended: true
    }

  ];


  /*
    ============================================================
    PROGRAM
    ============================================================
  */

  const programs = {

    "expres": {

      "2026-09-06": [
        {
          time: "06:00",
          name: "Ranná show"
        },
        {
          time: "10:00",
          name: "Dopoludnie"
        },
        {
          time: "14:00",
          name: "Popoludnie"
        },
        {
          time: "18:00",
          name: "Večerný program"
        },
        {
          time: "22:00",
          name: "Nočný Expres"
        }
      ]

    },

    "melody": {

      "2026-09-06": [
        {
          time: "06:00",
          name: "Ranná Melody"
        },
        {
          time: "10:00",
          name: "Dopoludňajšia Melody"
        },
        {
          time: "14:00",
          name: "Melody popoludnie"
        },
        {
          time: "18:00",
          name: "Večerná Melody"
        },
        {
          time: "22:00",
          name: "Melody noc"
        }
      ]

    }

  };


  /*
    ============================================================
    PREMENNÉ
    ============================================================
  */

  let currentRadio = radios[0];

  let favorites =
    JSON.parse(localStorage.getItem("favorites") || "[]");

  let myRadios =
    JSON.parse(localStorage.getItem("myRadios") || "[]");

  let metadataTimer = null;


  /*
    ============================================================
    METADATA SERVER
    ============================================================

    DÔLEŽITÉ:
    Toto musí byť URL na serveri, ktorý podporuje PHP.

    GitHub Pages PHP NESPÚŠŤA.
  */

  const METADATA_SERVER =
    "https://jaroacjak.github.io/pocuvamradio/metadata.php";


  /*
    ============================================================
    NAČÍTANIE RÁDIA
    ============================================================
  */

  function loadRadio(radio) {

    currentRadio = radio;

    const audio = document.getElementById("audio");

    audio.pause();

    audio.src = radio.stream;

    document.getElementById("radioName").textContent =
      radio.name;

    document.getElementById("songTitle").textContent =
      "Načítavam skladbu...";

    document.getElementById("artistName").textContent =
      "";

    document.getElementById("status").textContent =
      "Pripravené";

    /*
      Logo
    */

    const logoContainer =
      document.getElementById("logoContainer");

    if (radio.logo) {

      logoContainer.innerHTML =
        `<img class="logo" src="${escapeHtml(radio.logo)}" alt="${escapeHtml(radio.name)}">`;

    } else {

      logoContainer.innerHTML =
        `<div class="no-logo">📻</div>`;

    }


    /*
      Web
    */

    const websiteContainer =
      document.getElementById("websiteContainer");

    if (radio.web) {

      websiteContainer.innerHTML =
        `<a href="${escapeHtml(radio.web)}" target="_blank" rel="noopener">
          🌐 Web rádia
        </a>`;

    } else {

      websiteContainer.innerHTML = "";

    }


    updateFavoriteButton();

    clearInterval(metadataTimer);

    metadataTimer = null;

  }


  /*
    ============================================================
    PREHRÁVANIE
    ============================================================
  */

  function togglePlay() {

    const audio =
      document.getElementById("audio");

    if (audio.paused) {

      audio.play()
        .then(() => {

          document.getElementById("playBtn").textContent =
            "⏸️ Pozastaviť";

          document.getElementById("status").textContent =
            "▶️ Prehráva sa";

          startMetadata();

        })
        .catch(() => {

          document.getElementById("status").textContent =
            "Nepodarilo sa spustiť stream";

        });

    } else {

      audio.pause();

      document.getElementById("playBtn").textContent =
        "▶️ Prehrať";

      document.getElementById("status").textContent =
        "Pozastavené";

      clearInterval(metadataTimer);

      metadataTimer = null;

    }

  }


  /*
    ============================================================
    AUDIO EVENTY
    ============================================================
  */

  document.getElementById("audio").addEventListener(
    "play",
    function() {

      document.getElementById("playBtn").textContent =
        "⏸️ Pozastaviť";

      document.getElementById("status").textContent =
        "▶️ Prehráva sa";

      startMetadata();

    }
  );


  document.getElementById("audio").addEventListener(
    "pause",
    function() {

      document.getElementById("playBtn").textContent =
        "▶️ Prehrať";

      if (!this.ended) {

        document.getElementById("status").textContent =
          "Pozastavené";

      }

      clearInterval(metadataTimer);

      metadataTimer = null;

    }
  );


  document.getElementById("audio").addEventListener(
    "error",
    function() {

      document.getElementById("status").textContent =
        "Chyba streamu";

    }
  );


  /*
    ============================================================
    HLASITOSŤ
    ============================================================
  */

  function changeVolume() {

    const volume =
      document.getElementById("volume").value;

    document.getElementById("audio").volume =
      volume;

  }


  /*
    ============================================================
    OBĽÚBENÉ
    ============================================================
  */

  function isFavorite(id) {

    return favorites.includes(id);

  }


  function toggleFavorite() {

    const id = currentRadio.id;

    if (isFavorite(id)) {

      favorites =
        favorites.filter(item => item !== id);

    } else {

      favorites.push(id);

    }

    localStorage.setItem(
      "favorites",
      JSON.stringify(favorites)
    );

    updateFavoriteButton();
    renderFavorites();

  }


  function updateFavoriteButton() {

    const btn =
      document.getElementById("favoriteBtn");

    if (isFavorite(currentRadio.id)) {

      btn.textContent = "★ Obľúbené";
      btn.classList.add("active");

    } else {

      btn.textContent = "☆ Obľúbené";
      btn.classList.remove("active");

    }

  }


  /*
    ============================================================
    ODPORÚČANÉ
    ============================================================
  */

  function renderRecommended() {

    const container =
      document.getElementById("recommendedList");

    const recommended =
      radios.filter(radio => radio.recommended);

    if (recommended.length === 0) {

      container.innerHTML =
        `<div class="empty">Žiadne odporúčané rádiá.</div>`;

      return;

    }

    container.innerHTML = "";

    recommended.forEach(radio => {

      const card =
        document.createElement("div");

      card.className = "card";

      card.innerHTML = `
        <div>
          <div class="card-name">${escapeHtml(radio.name)}</div>
        </div>

        <div class="card-actions">
          <button
            class="small-btn"
            onclick="selectRadio('${escapeJs(radio.id)}')"
          >
            ▶️ Počúvať
          </button>
        </div>
      `;

      container.appendChild(card);

    });

  }


  /*
    ============================================================
    ZOZNAM RÁDIÍ
    ============================================================
  */

  function renderRadioList() {

    const container =
      document.getElementById("radioList");

    container.innerHTML = "";

    radios.forEach(radio => {

      const button =
        document.createElement("button");

      button.className = "radio-item";

      button.textContent =
        "📻 " + radio.name;

      button.onclick = function() {

        selectRadio(radio.id);

      };

      container.appendChild(button);

    });


    /*
      Moje rádiá
    */

    myRadios.forEach(radio => {

      const button =
        document.createElement("button");

      button.className = "radio-item";

      button.textContent =
        "📡 " + radio.name;

      button.onclick = function() {

        selectRadio(radio.id);

      };

      container.appendChild(button);

    });

  }


  /*
    ============================================================
    VÝBER RÁDIA
    ============================================================
  */

  function selectRadio(id) {

    let radio =
      radios.find(r => r.id === id);

    if (!radio) {

      radio =
        myRadios.find(r => r.id === id);

    }

    if (!radio) {
      return;
    }

    loadRadio(radio);

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  /*
    ============================================================
    MENU
    ============================================================
  */

  function toggleRadioMenu() {

    const menu =
      document.getElementById("radioMenu");

    if (menu.style.display === "block") {

      menu.style.display = "none";

    } else {

      menu.style.display = "block";

    }

  }


  /*
    ============================================================
    FAVORITES ZOBRAZENIE
    ============================================================
  */

  function renderFavorites() {

    const container =
      document.getElementById("favoritesList");

    container.innerHTML = "";

    const favoriteRadios = [];

    favorites.forEach(id => {

      let radio =
        radios.find(r => r.id === id);

      if (!radio) {

        radio =
          myRadios.find(r => r.id === id);

      }

      if (radio) {

        favoriteRadios.push(radio);

      }

    });


    if (favoriteRadios.length === 0) {

      container.innerHTML =
        `<div class="empty">
          Zatiaľ nemáš žiadne obľúbené rádio.
        </div>`;

      return;

    }


    favoriteRadios.forEach(radio => {

      const card =
        document.createElement("div");

      card.className = "card";

      card.innerHTML = `
        <div class="card-name">
          ${escapeHtml(radio.name)}
        </div>

        <div class="card-actions">

          <button
            class="small-btn"
            onclick="selectRadio('${escapeJs(radio.id)}')"
          >
            ▶️ Počúvať
          </button>

          <button
            class="small-btn"
            onclick="removeFavorite('${escapeJs(radio.id)}')"
          >
            ❌
          </button>

        </div>
      `;

      container.appendChild(card);

    });

  }


  function removeFavorite(id) {

    favorites =
      favorites.filter(item => item !== id);

    localStorage.setItem(
      "favorites",
      JSON.stringify(favorites)
    );

    updateFavoriteButton();
    renderFavorites();

  }


  /*
    ============================================================
    MOJE RÁDIÁ
    ============================================================
  */

  function addMyRadio(event) {

    event.preventDefault();

    const name =
      document.getElementById("myRadioName").value.trim();

    const stream =
      document.getElementById("myRadioStream").value.trim();

    const web =
      document.getElementById("myRadioWeb").value.trim();


    const id =
      "my_" +
      Date.now();


    const radio = {

      id: id,
      name: name,
      stream: stream,
      web: web,
      logo: "",
      recommended: false

    };


    myRadios.push(radio);


    localStorage.setItem(
      "myRadios",
      JSON.stringify(myRadios)
    );


    document.getElementById("myRadioName").value = "";
    document.getElementById("myRadioStream").value = "";
    document.getElementById("myRadioWeb").value = "";


    renderMyRadios();
    renderRadioList();

    alert("Rádio bolo pridané.");

  }


  function renderMyRadios() {

    const container =
      document.getElementById("myRadiosList");

    container.innerHTML = "";


    if (myRadios.length === 0) {

      container.innerHTML =
        `<div class="empty">
          Zatiaľ nemáš pridané vlastné rádio.
        </div>`;

      return;

    }


    myRadios.forEach(radio => {

      const card =
        document.createElement("div");

      card.className = "card";

      card.innerHTML = `

        <div>
          <div class="card-name">
            ${escapeHtml(radio.name)}
          </div>

          ${
            radio.web
              ? `<div>
                   <a href="${escapeHtml(radio.web)}"
                      target="_blank"
                      rel="noopener">
                     Web
                   </a>
                 </div>`
              : ""
          }

        </div>

        <div class="card-actions">

          <button
            class="small-btn"
            onclick="selectRadio('${escapeJs(radio.id)}')"
          >
            ▶️ Počúvať
          </button>

          <button
            class="small-btn"
            onclick="deleteMyRadio('${escapeJs(radio.id)}')"
          >
            🗑️
          </button>

        </div>

      `;

      container.appendChild(card);

    });

  }


  function deleteMyRadio(id) {

    myRadios =
      myRadios.filter(radio => radio.id !== id);

    favorites =
      favorites.filter(item => item !== id);


    localStorage.setItem(
      "myRadios",
      JSON.stringify(myRadios)
    );

    localStorage.setItem(
      "favorites",
      JSON.stringify(favorites)
    );


    renderMyRadios();
    renderFavorites();
    renderRadioList();
    updateFavoriteButton();

  }


  /*
    ============================================================
    NAVRHNÚŤ RÁDIO
    ============================================================
  */

  function suggestRadio(event) {

    event.preventDefault();

    const name =
      document.getElementById("suggestName").value.trim();

    const stream =
      document.getElementById("suggestStream").value.trim();

    const web =
      document.getElementById("suggestWeb").value.trim();

    const note =
      document.getElementById("suggestNote").value.trim();


    const suggestions =
      JSON.parse(
        localStorage.getItem("radioSuggestions") || "[]"
      );


    suggestions.push({

      name: name,
      stream: stream,
      web: web,
      note: note,
      date: new Date().toISOString()

    });


    localStorage.setItem(
      "radioSuggestions",
      JSON.stringify(suggestions)
    );


    document.getElementById("suggestName").value = "";
    document.getElementById("suggestStream").value = "";
    document.getElementById("suggestWeb").value = "";
    document.getElementById("suggestNote").value = "";


    document.getElementById(
      "suggestionMessage"
    ).innerHTML =
      `<p>✅ Ďakujeme za návrh rádia!</p>`;

  }


  /*
    ============================================================
    PROGRAM
    ============================================================
  */

  function showProgram() {

    const date =
      document.getElementById("programDate").value;

    const title =
      document.getElementById("programTitle");

    const content =
      document.getElementById("programContent");


    title.innerHTML =
      `<h3>📻 ${escapeHtml(currentRadio.name)}</h3>`;

    content.innerHTML = "";


    if (!date) {

      content.innerHTML =
        `<div class="empty">
          Vyber dátum programu.
        </div>`;

      return;

    }


    const radioProgram =
      programs[currentRadio.id];


    if (!radioProgram || !radioProgram[date]) {

      content.innerHTML =
        `<div class="empty">
          Program pre tento dátum zatiaľ nie je dostupný.
        </div>`;

      return;

    }


    radioProgram[date].forEach(item => {

      const div =
        document.createElement("div");

      div.className = "program-item";

      div.innerHTML = `
        <span class="program-time">
          ${escapeHtml(item.time)}
        </span>
        ${escapeHtml(item.name)}
      `;

      content.appendChild(div);

    });

  }


  /*
    ============================================================
    AUTOMATICKÉ METADATA
    ============================================================
  */

  function startMetadata() {

    clearInterval(metadataTimer);

    loadMetadata();

    metadataTimer =
      setInterval(loadMetadata, 10000);

  }


  async function loadMetadata() {

    const audio =
      document.getElementById("audio");


    if (audio.paused) {
      return;
    }


    /*
      Ak backend ešte nie je nastavený,
      nebudeme robiť požiadavku.
    */

    if (
      !METADATA_SERVER ||
      METADATA_SERVER.includes("TVOJ-PHP-SERVER")
    ) {

      return;

    }


    try {

      const response =
        await fetch(
          METADATA_SERVER +
          "?radio=" +
          encodeURIComponent(currentRadio.id) +
          "&t=" +
          Date.now(),
          {
            cache: "no-store"
          }
        );


      if (!response.ok) {
        return;
      }


      const data =
        await response.json();


      if (data.error) {
        return;
      }


      if (data.title) {

        document.getElementById(
          "songTitle"
        ).textContent =
          data.title;

      }


      if (data.artist) {

        document.getElementById(
          "artistName"
        ).textContent =
          data.artist;

      }


    } catch (error) {

      console.log(
        "Metadata sa nepodarilo načítať:",
        error
      );

    }

  }


  /*
    ============================================================
    BEZPEČNÉ VLOŽENIE TEXTU
    ============================================================
  */

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function escapeJs(value) {

    return String(value)
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'");

  }


  /*
    ============================================================
    INICIALIZÁCIA
    ============================================================
  */

  function initializeApp() {

    /*
      Predvolené rádio = Expres
    */

    loadRadio(currentRadio);


    /*
      Nastavenie hlasitosti
    */

    document.getElementById("audio").volume =
      document.getElementById("volume").value;


    /*
      Vykreslenie všetkých častí
    */

    renderRadioList();
    renderRecommended();
    renderFavorites();
    renderMyRadios();


    /*
      Dnešný dátum
    */

    const today =
      new Date().toISOString().split("T")[0];

    document.getElementById(
      "programDate"
    ).value = today;

    showProgram();

  }


  initializeApp();

</script>
