<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Počúvam Rádiá</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #111827;
        }

        header {
            background: #111827;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            margin: 0;
            font-size: 21px;
        }

        #menuButton {
            border: 0;
            background: transparent;
            color: white;
            font-size: 28px;
            cursor: pointer;
        }

        main {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .player {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            text-align: center;
        }

        .radio-logo {
            width: 150px;
            height: 150px;
            object-fit: contain;
            border-radius: 20px;
            margin-bottom: 10px;
            background: #eee;
        }

        .radio-name {
            font-size: 25px;
            font-weight: bold;
            margin: 5px 0;
        }

        .status {
            color: #6b7280;
            margin-bottom: 18px;
        }

        .metadata {
            background: #f9fafb;
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
        }

        .song-title {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .artist {
            font-size: 17px;
            color: #4b5563;
        }

        .website {
            margin-top: 10px;
        }

        .website a {
            color: #2563eb;
            text-decoration: none;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        .control-button {
            border: none;
            background: #111827;
            color: white;
            border-radius: 12px;
            padding: 11px 17px;
            cursor: pointer;
        }

        .control-button:hover {
            opacity: 0.9;
        }

        .favorite-button {
            background: #e5e7eb;
            color: #111827;
        }

        .favorite-button.active {
            background: #facc15;
            color: #111827;
        }

        #volume {
            width: 120px;
        }

        #radioMenu {
            display: none;
            background: white;
            padding: 15px 20px;
            border-bottom: 1px solid #ddd;
        }

        #radioMenu.open {
            display: block;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
        }

        .radio-item:hover {
            background: #f3f4f6;
        }

        .radio-item img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            border-radius: 8px;
            background: #eee;
        }

        .section {
            background: white;
            margin-top: 20px;
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .section h2 {
            margin-top: 0;
        }

        .recommended-list,
        .favorites-list,
        .my-radio-list {
            display: grid;
            gap: 10px;
        }

        .station-card {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .station-info {
            flex: 1;
        }

        .station-info strong {
            display: block;
        }

        form {
            display: grid;
            gap: 10px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .empty {
            color: #6b7280;
            padding: 10px 0;
        }

        .program-day {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 12px;
            margin-top: 10px;
        }

        .program-time {
            font-weight: bold;
            color: #2563eb;
        }

        @media (max-width: 600px) {
            main {
                padding: 12px;
            }

            .player {
                padding: 18px;
            }

            .radio-logo {
                width: 120px;
                height: 120px;
            }

            .station-card {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>📻 Počúvam Rádiá</h1>
    <button id="menuButton" aria-label="Menu">☰</button>
</header>

<nav id="radioMenu">
    <div id="radioList"></div>
</nav>

<main>

    <!-- HLAVNÝ PREHRÁVAČ -->
    <section class="player">

        <img
            id="radioLogo"
            class="radio-logo"
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRObKScNrVH6CHuGgHAglR-ZjGL0Crgp6whWV5GNDMzqQ&s=10"
            alt="Logo rádia"
        >

        <div id="radioName" class="radio-name">
            Rádio Expres
        </div>

        <div id="status" class="status">
            Pripravené
        </div>

        <div class="metadata">
            <div id="songTitle" class="song-title">
                Čakám na názov pesničky...
            </div>

            <div id="artistName" class="artist">
                Čakám na interpreta...
            </div>
        </div>

        <div id="website" class="website"></div>

        <div class="controls">

            <button id="playButton" class="control-button">
                ▶ Prehrať
            </button>

            <button
                id="favoriteButton"
                class="control-button favorite-button"
            >
                ☆ Obľúbené
            </button>

            <label>
                🔊
                <input
                    id="volume"
                    type="range"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.8"
                >
            </label>

        </div>

        <audio id="radio" preload="none"></audio>

    </section>


    <!-- ODPORÚČANÉ -->
    <section class="section">

        <h2>⭐ Odporúčané</h2>

        <div
            id="recommendedList"
            class="recommended-list"
        ></div>

    </section>


    <!-- OBĽÚBENÉ -->
    <section class="section">

        <h2>❤️ Obľúbené</h2>

        <div
            id="favoritesList"
            class="favorites-list"
        ></div>

    </section>


    <!-- MOJE RÁDIÁ -->
    <section class="section">

        <h2>📻 Moje rádiá</h2>

        <div
            id="myRadioList"
            class="my-radio-list"
        ></div>

        <hr>

        <h3>Pridať vlastné rádio</h3>

        <form id="myRadioForm">

            <input
                id="myRadioName"
                type="text"
                placeholder="Názov rádia"
                required
            >

            <input
                id="myRadioStream"
                type="url"
                placeholder="Stream URL"
                required
            >

            <input
                id="myRadioWeb"
                type="url"
                placeholder="Web rádia (voliteľné)"
            >

            <button
                class="control-button"
                type="submit"
            >
                ➕ Pridať rádio
            </button>

        </form>

    </section>


    <!-- NAVRHNÚŤ RÁDIO -->
    <section class="section">

        <h2>💡 Navrhnúť rádio</h2>

        <form id="suggestForm">

            <input
                id="suggestName"
                type="text"
                placeholder="Názov rádia"
                required
            >

            <input
                id="suggestStream"
                type="url"
                placeholder="Stream URL"
                required
            >

            <input
                id="suggestWeb"
                type="url"
                placeholder="Web rádia (voliteľné)"
            >

            <textarea
                id="suggestNote"
                placeholder="Poznámka (voliteľné)"
            ></textarea>

            <button
                class="control-button"
                type="submit"
            >
                📤 Odoslať návrh
            </button>

        </form>

        <p id="suggestMessage"></p>

    </section>


    <!-- PROGRAM -->
    <section class="section">

        <h2>📅 Program</h2>

        <select id="programRadio"></select>

        <br><br>

        <input
            id="programDate"
            type="date"
        >

        <div id="programContent"></div>

    </section>

</main>


<script>

/* ==========================================
   RÁDIÁ
   ========================================== */

const radios = [

    {
        id: "expres",
        name: "Rádio Expres",
        stream: "https://stream.bauermedia.sk/expres-hi.mp3",
        web: "https://www.bauermedia.sk",
        logo: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRObKScNrVH6CHuGgHAglR-ZjGL0Crgp6whWV5GNDMzqQ&s=10",
        recommended: true
    },

    {
        id: "melody",
        name: "Rádio Melody",
        stream: "https://stream.bauermedia.sk/melody-hi.mp3",
        web: "https://www.bauermedia.sk",
        logo: "",
        recommended: true
    }

];


/* ==========================================
   PROGRAM
   ========================================== */

const programs = {

    expres: {

        "2026-09-06": [
            {
                time: "06:00",
                name: "Ranný program"
            },
            {
                time: "10:00",
                name: "Dopoludnie"
            },
            {
                time: "14:00",
                name: "Popoludnie"
            },
            {
                time: "18:00",
                name: "Večer"
            }
        ]

    },

    melody: {

        "2026-09-06": [
            {
                time: "06:00",
                name: "Ranné Melody"
            },
            {
                time: "10:00",
                name: "Melody dopoludnie"
            },
            {
                time: "14:00",
                name: "Melody popoludnie"
            },
            {
                time: "18:00",
                name: "Melody večer"
            }
        ]

    }

};


/* ==========================================
   ELEMENTY
   ========================================== */

const radio =
    document.getElementById("radio");

const playButton =
    document.getElementById("playButton");

const volume =
    document.getElementById("volume");

const radioLogo =
    document.getElementById("radioLogo");

const radioName =
    document.getElementById("radioName");

const status =
    document.getElementById("status");

const website =
    document.getElementById("website");

const songTitle =
    document.getElementById("songTitle");

const artistName =
    document.getElementById("artistName");

const favoriteButton =
    document.getElementById("favoriteButton");

const menuButton =
    document.getElementById("menuButton");

const radioMenu =
    document.getElementById("radioMenu");


/* ==========================================
   LOCAL STORAGE
   ========================================== */

let favorites =
    JSON.parse(
        localStorage.getItem("favorites") || "[]"
    );

let myRadios =
    JSON.parse(
        localStorage.getItem("myRadios") || "[]"
    );

let suggestions =
    JSON.parse(
        localStorage.getItem("suggestions") || "[]"
    );


/* ==========================================
   AKTUÁLNE RÁDIO
   ========================================== */

let currentRadio = radios[0];


/* ==========================================
   MENU
   ========================================== */

menuButton.addEventListener("click", () => {

    radioMenu.classList.toggle("open");

});


/* ==========================================
   VÝBER RÁDIA
   ========================================== */

function selectRadio(radioData) {

    currentRadio = radioData;

    radio.src = radioData.stream;

    radioName.textContent =
        radioData.name;

    if (radioData.logo) {

        radioLogo.src =
            radioData.logo;

        radioLogo.style.display =
            "block";

    } else {

        radioLogo.style.display =
            "none";

    }

    if (radioData.web) {

        website.innerHTML =
            `<a href="${radioData.web}"
                target="_blank"
                rel="noopener">
                ${radioData.web.replace(
                    /^https?:\/\//,
                    ""
                )}
            </a>`;

    } else {

        website.innerHTML = "";

    }

    songTitle.textContent =
        "Čakám na názov pesničky...";

    artistName.textContent =
        "Čakám na interpreta...";

    updateFavoriteButton();

    status.textContent =
        "Pripravené";

    loadMetadata();

}


/* ==========================================
   PLAY / PAUSE
   ========================================== */

playButton.addEventListener(
    "click",
    async () => {

        if (radio.paused) {

            try {

                await radio.play();

                playButton.textContent =
                    "⏸ Pozastaviť";

                status.textContent =
                    "▶ Hrá";

                loadMetadata();

            } catch (error) {

                console.error(error);

                status.textContent =
                    "Prehrávanie sa nepodarilo spustiť.";

            }

        } else {

            radio.pause();

            playButton.textContent =
                "▶ Prehrať";

            status.textContent =
                "Pozastavené";

        }

    }
);


radio.addEventListener(
    "playing",
    () => {

        playButton.textContent =
            "⏸ Pozastaviť";

        status.textContent =
            "▶ Hrá";

    }
);


radio.addEventListener(
    "pause",
    () => {

        playButton.textContent =
            "▶ Prehrať";

    }
);


radio.addEventListener(
    "error",
    () => {

        status.textContent =
            "Stream sa nepodarilo načítať.";

    }
);


/* ==========================================
   HLASITOSŤ
   ========================================== */

radio.volume = 0.8;

volume.addEventListener(
    "input",
    () => {

        radio.volume =
            volume.value;

    }
);


/* ==========================================
   OBLÚBENÉ
   ========================================== */

favoriteButton.addEventListener(
    "click",
    () => {

        const exists =
            favorites.includes(
                currentRadio.id
            );

        if (exists) {

            favorites =
                favorites.filter(
                    id => id !== currentRadio.id
                );

        } else {

            favorites.push(
                currentRadio.id
            );

        }

        localStorage.setItem(
            "favorites",
            JSON.stringify(favorites)
        );

        updateFavoriteButton();

        renderFavorites();

    }
);


function updateFavoriteButton() {

    if (
        favorites.includes(
            currentRadio.id
        )
    ) {

        favoriteButton.textContent =
            "★ Obľúbené";

        favoriteButton.classList.add(
            "active"
        );

    } else {

        favoriteButton.textContent =
            "☆ Obľúbené";

        favoriteButton.classList.remove(
            "active"
        );

    }

}


/* ==========================================
   MENU RÁDIÍ
   ========================================== */

function renderRadioList() {

    const list =
        document.getElementById(
            "radioList"
        );

    list.innerHTML = "";

    [...radios, ...myRadios].forEach(
        r => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "radio-item";

            item.innerHTML = `

                ${
                    r.logo
                    ? `<img
                        src="${r.logo}"
                        alt="">
                    `
                    : `<div style="
                        width:45px;
                        height:45px;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        background:#eee;
                        border-radius:8px;
                    ">📻</div>`
                }

                <strong>
                    ${escapeHtml(r.name)}
                </strong>
            `;

            item.addEventListener(
                "click",
                () => {

                    selectRadio(r);

                    radioMenu.classList.remove(
                        "open"
                    );

                }
            );

            list.appendChild(item);

        }
    );

}


/* ==========================================
   ODPORÚČANÉ
   ========================================== */

function renderRecommended() {

    const container =
        document.getElementById(
            "recommendedList"
        );

    container.innerHTML = "";

    radios
        .filter(
            r => r.recommended
        )
        .forEach(
            r => {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "station-card";

                card.innerHTML = `

                    <div class="station-info">

                        <strong>
                            ${escapeHtml(r.name)}
                        </strong>

                        <small>
                            Online rádio
                        </small>

                    </div>

                    <button
                        class="control-button">
                        ▶ Počúvať
                    </button>

                `;

                card.querySelector(
                    "button"
                ).addEventListener(
                    "click",
                    () => {

                        selectRadio(r);

                        window.scrollTo({
                            top: 0,
                            behavior: "smooth"
                        });

                    }
                );

                container.appendChild(
                    card
                );

            }
        );

}


/* ==========================================
   FAVORITES
   ========================================== */

function renderFavorites() {

    const container =
        document.getElementById(
            "favoritesList"
        );

    container.innerHTML = "";

    const allRadios =
        [...radios, ...myRadios];

    const favoriteRadios =
        allRadios.filter(
            r =>
                favorites.includes(
                    r.id
                )
        );

    if (
        favoriteRadios.length === 0
    ) {

        container.innerHTML =
            `<div class="empty">
                Zatiaľ nemáš žiadne obľúbené rádio.
            </div>`;

        return;

    }

    favoriteRadios.forEach(
        r => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "station-card";

            card.innerHTML = `

                <div class="station-info">
                    <strong>
                        ${escapeHtml(r.name)}
                    </strong>
                </div>

                <button
                    class="control-button">
                    ▶ Počúvať
                </button>

            `;

            card.querySelector(
                "button"
            ).addEventListener(
                "click",
                () => {

                    selectRadio(r);

                    window.scrollTo({
                        top: 0,
                        behavior: "smooth"
                    });

                }
            );

            container.appendChild(
                card
            );

        }
    );

}


/* ==========================================
   MOJE RÁDIÁ
   ========================================== */

function renderMyRadios() {

    const container =
        document.getElementById(
            "myRadioList"
        );

    container.innerHTML = "";

    if (myRadios.length === 0) {

        container.innerHTML =
            `<div class="empty">
                Zatiaľ nemáš pridané vlastné rádio.
            </div>`;

        return;

    }

    myRadios.forEach(
        (r, index) => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "station-card";

            card.innerHTML = `

                <div class="station-info">

                    <strong>
                        ${escapeHtml(r.name)}
                    </strong>

                    <small>
                        ${escapeHtml(r.stream)}
                    </small>

                </div>

                <button
                    class="control-button">
                    ▶
                </button>

                <button
                    class="control-button"
                    data-delete="${index}">
                    🗑
                </button>

            `;

            card.querySelectorAll(
                "button"
            )[0].addEventListener(
                "click",
                () => {

                    selectRadio(r);

                    window.scrollTo({
                        top: 0,
                        behavior: "smooth"
                    });

                }
            );

            card.querySelector(
                "[data-delete]"
            ).addEventListener(
                "click",
                () => {

                    myRadios.splice(
                        index,
                        1
                    );

                    localStorage.setItem(
                        "myRadios",
                        JSON.stringify(
                            myRadios
                        )
                    );

                    renderMyRadios();
                    renderRadioList();
                    renderFavorites();
                    setupProgramRadios();

                }
            );

            container.appendChild(
                card
            );

        }
    );

}


document
    .getElementById("myRadioForm")
    .addEventListener(
        "submit",
        event => {

            event.preventDefault();

            const name =
                document
                    .getElementById(
                        "myRadioName"
                    )
                    .value
                    .trim();

            const stream =
                document
                    .getElementById(
                        "myRadioStream"
                    )
                    .value
                    .trim();

            const web =
                document
                    .getElementById(
                        "myRadioWeb"
                    )
                    .value
                    .trim();

            const newRadio = {

                id:
                    "my-" +
                    Date.now(),

                name,
                stream,
                web,
                logo: "",
                recommended: false

            };

            myRadios.push(
                newRadio
            );

            localStorage.setItem(
                "myRadios",
                JSON.stringify(
                    myRadios
                )
            );

            event.target.reset();

            renderMyRadios();
            renderRadioList();
            setupProgramRadios();

        }
    );


/* ==========================================
   NAVRHNÚŤ RÁDIO
   ========================================== */

document
    .getElementById("suggestForm")
    .addEventListener(
        "submit",
        event => {

            event.preventDefault();

            const suggestion = {

                name:
                    document
                        .getElementById(
                            "suggestName"
                        )
                        .value
                        .trim(),

                stream:
                    document
                        .getElementById(
                            "suggestStream"
                        )
                        .value
                        .trim(),

                web:
                    document
                        .getElementById(
                            "suggestWeb"
                        )
                        .value
                        .trim(),

                note:
                    document
                        .getElementById(
                            "suggestNote"
                        )
                        .value
                        .trim(),

                date:
                    new Date().toISOString()

            };

            suggestions.push(
                suggestion
            );

            localStorage.setItem(
                "suggestions",
                JSON.stringify(
                    suggestions
                )
            );

            event.target.reset();

            document.getElementById(
                "suggestMessage"
            ).textContent =
                "✅ Ďakujem za návrh rádia!";

        }
    );


/* ==========================================
   PROGRAM
   ========================================== */

const programRadio =
    document.getElementById(
        "programRadio"
    );

const programDate =
    document.getElementById(
        "programDate"
    );


function setupProgramRadios() {

    const oldValue =
        programRadio.value;

    programRadio.innerHTML = "";

    [...radios, ...myRadios].forEach(
        r => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                r.id;

            option.textContent =
                r.name;

            programRadio.appendChild(
                option
            );

        }
    );

    if (
        [...programRadio.options]
            .some(
                option =>
                    option.value === oldValue
            )
    ) {

        programRadio.value =
            oldValue;

    }

}


function renderProgram() {

    const container =
        document.getElementById(
            "programContent"
        );

    const radioId =
        programRadio.value;

    const date =
        programDate.value;

    container.innerHTML = "";

    if (!date) {

        container.innerHTML =
            `<div class="empty">
                Vyber dátum programu.
            </div>`;

        return;

    }

    const radioProgram =
        programs[radioId];

    if (
        !radioProgram ||
        !radioProgram[date]
    ) {

        container.innerHTML =
            `<div class="empty">
                Program pre tento deň zatiaľ nie je dostupný.
            </div>`;

        return;

    }

    radioProgram[date].forEach(
        item => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "program-day";

            div.innerHTML = `

                <div class="program-time">
                    ${escapeHtml(item.time)}
                </div>

                <div>
                    ${escapeHtml(item.name)}
                </div>

            `;

            container.appendChild(
                div
            );

        }
    );

}


programRadio.addEventListener(
    "change",
    renderProgram
);

programDate.addEventListener(
    "change",
    renderProgram
);


/* ==========================================
   AUTOMATICKÉ METADATA
   ========================================== */

/*
 * Toto je adresa tvojho metadata.php.
 *
 * POZOR:
 * GitHub Pages PHP nespúšťa.
 * Keď bude metadata.php na PHP serveri,
 * túto adresu zmeníme na jeho skutočnú adresu.
 */

const METADATA_SERVER =
    "https://jaroacjak.github.io/pocuvamradio/metadata.php";


async function loadMetadata() {

    if (!METADATA_SERVER) {
        return;
    }

    /*
     * Metadata z nášho backendu zatiaľ
     * používame pre Expres a Melody.
     */

    if (
        currentRadio.id !== "expres" &&
        currentRadio.id !== "melody"
    ) {
        return;
    }

    try {

        const response =
            await fetch(
                METADATA_SERVER +
                "?radio=" +
                encodeURIComponent(
                    currentRadio.id
                ) +
                "&t=" +
                Date.now()
            );

        if (!response.ok) {

            throw new Error(
                "Metadata server odpovedal chybou"
            );

        }

        const data =
            await response.json();

        if (data.title) {

            songTitle.textContent =
                data.title;

        }

        if (data.artist) {

            artistName.textContent =
                data.artist;

        }

    } catch (error) {

        console.log(
            "Metadata zatiaľ nie sú dostupné:",
            error
        );

    }

}


/* ==========================================
   METADATA KAŽDÝCH 10 SEKÚND
   ========================================== */

setInterval(
    () => {

        if (!radio.paused) {

            loadMetadata();

        }

    },
    10000
);


/* ==========================================
   BEZPEČNÉ ZOBRAZENIE TEXTU
   ========================================== */

function escapeHtml(text) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* ==========================================
   DNEŠNÝ DÁTUM
   ========================================== */

function setToday() {

    const today =
        new Date();

    const year =
        today.getFullYear();

    const month =
        String(
            today.getMonth() + 1
        ).padStart(
            2,
            "0"
        );

    const day =
        String(
            today.getDate()
        ).padStart(
            2,
            "0"
        );

    programDate.value =
        `${year}-${month}-${day}`;

}


/* ==========================================
   SPUSTENIE APLIKÁCIE
   ========================================== */

selectRadio(
    currentRadio
);

renderRadioList();

renderRecommended();

renderFavorites();

renderMyRadios();

setupProgramRadios();

setToday();

renderProgram();

</script>
