<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Počúvam Rádiá</title>

<script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f4f7;
    color:#222
}

header{
    height:64px;
    background:#111827;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    position:sticky;
    top:0;
    z-index:1000
}

header h1{
    margin:0;
    font-size:21px
}

.menu-button{
    border:0;
    background:transparent;
    color:white;
    font-size:30px;
    cursor:pointer;
    line-height:1
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    opacity:0;
    visibility:hidden;
    transition:.25s;
    z-index:1998
}

.overlay.open{
    opacity:1;
    visibility:visible
}

.side-menu{
    position:fixed;
    top:0;
    left:0;
    width:340px;
    max-width:90%;
    height:100vh;
    overflow-y:auto;
    background:white;
    transform:translateX(-100%);
    transition:transform .25s ease;
    z-index:1999;
    padding:20px;
    box-shadow:4px 0 20px rgba(0,0,0,.2)
}

.side-menu.open{
    transform:translateX(0)
}

.side-menu h2{
    margin-top:0
}

.close-menu{
    float:right;
    border:0;
    background:#eee;
    border-radius:8px;
    width:38px;
    height:38px;
    font-size:22px;
    cursor:pointer
}

.menu-section{
    margin-top:22px
}

.menu-section h3{
    margin:0 0 10px;
    font-size:16px
}

.radio-item,
.favorite-item,
.my-radio-item,
.recommended-item{
    width:100%;
    border:1px solid #ddd;
    background:#fafafa;
    border-radius:10px;
    padding:11px;
    margin-bottom:8px;
    text-align:left;
    cursor:pointer
}

.radio-item:hover,
.favorite-item:hover,
.my-radio-item:hover,
.recommended-item:hover{
    background:#f0f2f5
}

.radio-item.active{
    border-color:#111827;
    background:#e8ebef
}

.item-title{
    font-weight:bold
}

.item-small{
    display:block;
    margin-top:3px;
    font-size:12px;
    color:#666
}

form{
    display:grid;
    gap:8px
}

input,
textarea,
select{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
    font:inherit
}

textarea{
    min-height:80px;
    resize:vertical
}

.form-button{
    border:0;
    background:#111827;
    color:white;
    border-radius:8px;
    padding:11px;
    cursor:pointer;
    font-weight:bold
}

.danger-button{
    border:0;
    background:#dc2626;
    color:white;
    border-radius:7px;
    padding:7px 9px;
    cursor:pointer;
    margin-top:7px
}

main{
    min-height:calc(100vh - 120px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px 15px
}

.player{
    width:100%;
    max-width:620px;
    background:white;
    border-radius:20px;
    padding:28px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
    text-align:center
}

.radio-logo{
    width:130px;
    height:130px;
    object-fit:contain;
    border-radius:18px;
    background:#f1f3f5;
    margin-bottom:15px
}

.radio-name{
    margin:0;
    font-size:28px
}

.radio-web{
    display:inline-block;
    margin-top:8px;
    color:#2563eb;
    text-decoration:none
}

.now-playing{
    margin:25px 0;
    padding:18px;
    border-radius:14px;
    background:#f4f5f7
}

.now-label{
    font-size:12px;
    color:#777;
    text-transform:uppercase;
    letter-spacing:.08em
}

.song-title{
    margin-top:8px;
    font-size:21px;
    font-weight:bold
}

.artist{
    margin-top:5px;
    color:#666
}

.controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap
}

.control-button{
    border:0;
    width:52px;
    height:52px;
    border-radius:50%;
    background:#111827;
    color:white;
    font-size:21px;
    cursor:pointer
}

.control-button:hover{
    opacity:.9
}

.favorite-button{
    background:#f1f3f5;
    color:#222
}

.favorite-button.active{
    color:#e11d48
}

.cast-button{
    background:#f1f3f5;
    color:#222;
    font-size:20px
}

.cast-button:hover{
    background:#e5e7eb
}

.cast-button.cast-connected{
    background:#111827;
    color:white
}

.cast-message{
    min-height:18px;
    margin-top:12px;
    font-size:13px;
    color:#666
}

.volume-box{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:18px
}

.volume-box input{
    padding:0
}

.status{
    margin-top:15px;
    font-size:13px;
    color:#666
}

footer{
    text-align:center;
    padding:20px;
    color:#777;
    font-size:13px
}

.empty{
    color:#777;
    font-size:14px;
    padding:5px 0
}

.program-box{
    background:#f6f7f9;
    border-radius:10px;
    padding:12px;
    margin-top:10px
}

.program-row{
    display:grid;
    grid-template-columns:55px 1fr;
    gap:8px;
    padding:8px 0;
    border-bottom:1px solid #ddd
}

.program-row:last-child{
    border-bottom:0
}

.program-time,
.program-name{
    font-weight:bold
}

.program-radio-name{
    font-size:12px;
    color:#777;
    margin-top:3px
}

.firebase-status{
    margin-top:8px;
    font-size:12px;
    color:#777
}

@media(max-width:600px){
    .player{
        padding:22px 16px
    }

    .radio-logo{
        width:105px;
        height:105px
    }

    .radio-name{
        font-size:23px
    }

    .side-menu{
        width:320px
    }
}
</style>
</head>

<body>

<header>
    <h1>Počúvam Rádiá</h1>

    <button
        class="menu-button"
        type="button"
        aria-label="Otvoriť menu"
        onclick="toggleSideMenu()">
        ☰
    </button>
</header>


<div
    id="menuOverlay"
    class="overlay"
    onclick="closeSideMenu()">
</div>


<aside id="sideMenu" class="side-menu">

    <button
        class="close-menu"
        type="button"
        aria-label="Zavrieť menu"
        onclick="closeSideMenu()">
        ×
    </button>

    <h2>Menu</h2>


    <!-- RÁDIÁ -->
    <section class="menu-section">

        <h3>📻 Rádiá</h3>

        <div id="radioList"></div>

    </section>


    <!-- ODPORÚČANÉ -->
    <section class="menu-section">

        <h3>⭐ Odporúčané</h3>

        <div id="recommendedList"></div>

    </section>


    <!-- OBĽÚBENÉ -->
    <section class="menu-section">

        <h3>❤️ Obľúbené</h3>

        <div id="favoritesList"></div>

    </section>


    <!-- MOJE RÁDIÁ -->
    <section class="menu-section">

        <h3>📡 Moje rádiá</h3>

        <div id="myRadiosList"></div>

        <form onsubmit="addMyRadio(event)">

            <input
                id="myRadioName"
                type="text"
                placeholder="Názov rádia"
                required>

            <input
                id="myRadioStream"
                type="url"
                placeholder="Stream URL"
                required>

            <input
                id="myRadioWeb"
                type="url"
                placeholder="Web rádia – voliteľné">

            <button
                class="form-button"
                type="submit">
                ➕ Pridať rádio
            </button>

        </form>

    </section>


    <!-- NÁVRH -->
    <section class="menu-section">

        <h3>💡 Navrhnúť rádio</h3>

        <form onsubmit="suggestRadio(event)">

            <input
                id="suggestName"
                type="text"
                placeholder="Názov rádia"
                required>

            <input
                id="suggestStream"
                type="url"
                placeholder="Stream URL"
                required>

            <input
                id="suggestWeb"
                type="url"
                placeholder="Web rádia – voliteľné">

            <textarea
                id="suggestNote"
                placeholder="Poznámka – voliteľné"></textarea>

            <button
                class="form-button"
                type="submit">
                💡 Odoslať návrh
            </button>

        </form>

        <div
            id="suggestMessage"
            class="status">
        </div>

    </section>

</aside>


<main>

<section class="player">

    <img
        id="radioLogo"
        class="radio-logo"
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRObKScNrVH6CHuGgHAglR-ZjGL0Crgp6whWV5GNDMzqQ&s=10"
        alt="Logo rádia">


    <h2
        id="radioName"
        class="radio-name">
        Rádio Expres
    </h2>


    <a
        id="radioWeb"
        class="radio-web"
        href="https://www.bauermedia.sk"
        target="_blank"
        rel="noopener">
        www.bauermedia.sk
    </a>


    <!-- AKTUÁLNE HRÁ -->
    <div class="now-playing">

        <div class="now-label">
            Práve hrá
        </div>

        <div
            id="songTitle"
            class="song-title">
            Načítavam...
        </div>

        <div
            id="artist"
            class="artist">
        </div>

    </div>


    <!-- OVLÁDANIE -->
    <div class="controls">

        <button
            id="playButton"
            class="control-button"
            type="button"
            onclick="togglePlay()"
            aria-label="Prehrať alebo pozastaviť">
            ▶
        </button>


        <button
            id="favoriteButton"
            class="control-button favorite-button"
            type="button"
            onclick="toggleFavorite()"
            aria-label="Obľúbené">
            ♡
        </button>


        <button
            id="castButton"
            class="control-button cast-button"
            type="button"
            onclick="googleCastPreparing()"
            aria-label="Google Cast">
            📺
        </button>

    </div>


    <div
        id="castMessage"
        class="cast-message">
    </div>


    <!-- HLASITOSŤ -->
    <div class="volume-box">

        <span>🔊</span>

        <input
            id="volumeControl"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="1"
            oninput="changeVolume(this.value)">

    </div>


    <div
        id="playerStatus"
        class="status">
        Pripravené
    </div>


    <audio
        id="audioPlayer"
        preload="none">
    </audio>

</section>

</main>


<!-- PROGRAM -->
<section
    id="programSection"
    style="max-width:900px;margin:0 auto 30px;padding:0 15px;">

    <div
        style="background:white;border-radius:20px;padding:25px;box-shadow:0 8px 30px rgba(0,0,0,.08);">

        <h2 style="margin-top:0;">
            📅 Program
        </h2>


        <label for="programDate">
            Vyber dátum:
        </label>


        <input
            id="programDate"
            type="date"
            style="margin-top:8px;max-width:220px;"
            onchange="showProgram()">


        <div
            id="programContent"
            class="program-box">
            Vyber dátum programu.
        </div>

    </div>

</section>


<footer>
    Počúvam Rádiá
</footer>


<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


<script>

// ======================================================
// FIREBASE
// ======================================================

const firebaseConfig = {
    apiKey: "AIzaSyD9L1TbbJ8cNm_DdMAUQKLdwMsyrqkZoeg",
    authDomain: "pocuvamradio-6a83d.firebaseapp.com",
    databaseURL: "https://pocuvamradio-6a83d-default-rtdb.firebaseio.com",
    projectId: "pocuvamradio-6a83d",
    storageBucket: "pocuvamradio-6a83d.firebasestorage.app",
    messagingSenderId: "478955104183",
    appId: "1:478955104183:web:a61712cc8b001989ae2a32",
    measurementId: "G-FD47QJ38EQ"
};

firebase.initializeApp(firebaseConfig);

const database = firebase.database();

const metadataRef =
    database.ref("metadata");


// ======================================================
// RÁDIÁ
// ======================================================

const radios = [

    {
        id:"expres",
        name:"Rádio Expres",
        stream:"https://stream.bauermedia.sk/expres-hi.mp3",
        web:"https://www.bauermedia.sk",
        logo:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRObKScNrVH6CHuGgHAglR-ZjGL0Crgp6whWV5GNDMzqQ&s=10",
        recommended:true
    },

    {
        id:"melody",
        name:"Rádio Melody",
        stream:"https://stream.bauermedia.sk/melody-hi.mp3",
        web:"https://www.bauermedia.sk",
        logo:"",
        recommended:true
    }

];


// ======================================================
// STAV APLIKÁCIE
// ======================================================

let currentRadio = radios[0];

let favorites =
    JSON.parse(
        localStorage.getItem("pocuvam_favorites") || "[]"
    );

let myRadios =
    JSON.parse(
        localStorage.getItem("pocuvam_my_radios") || "[]"
    );

let suggestions =
    JSON.parse(
        localStorage.getItem("pocuvam_suggestions") || "[]"
    );

let metadataTimer = null;

let metadataListener = null;

let metadataCache = {};

let programRequestId = 0;


const audioPlayer =
    document.getElementById("audioPlayer");


// ======================================================
// BEZPEČNÉ HTML
// ======================================================

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeJs(value){

    return String(value ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");

}


// ======================================================
// MENU
// ======================================================

function toggleSideMenu(){

    document
        .getElementById("sideMenu")
        .classList.add("open");

    document
        .getElementById("menuOverlay")
        .classList.add("open");

}


function closeSideMenu(){

    document
        .getElementById("sideMenu")
        .classList.remove("open");

    document
        .getElementById("menuOverlay")
        .classList.remove("open");

}


// ======================================================
// GOOGLE CAST
// ======================================================

function googleCastPreparing(){

    document
        .getElementById("castMessage")
        .textContent =
        "Google Cast pripravujeme.";

    setTimeout(() => {

        document
            .getElementById("castMessage")
            .textContent = "";

    },4000);

}


// ======================================================
// NAČÍTANIE RÁDIA
// ======================================================

function loadRadio(radio){

    if(!radio) return;


    const shouldPlay =
        !audioPlayer.paused;


    currentRadio = radio;


    if(
        window.PocuvamRadiaCast &&
        typeof window.PocuvamRadiaCast.setRadio === "function"
    ){

        window.PocuvamRadiaCast.setRadio(radio);

    }


    // Zastavenie starého metadata timeru

    if(metadataTimer){

        clearInterval(metadataTimer);

        metadataTimer = null;

    }


    if(metadataListener){

        metadataRef.off(
            "value",
            metadataListener
        );

        metadataListener = null;

    }


    // Zastavenie rádia

    audioPlayer.pause();

    audioPlayer.src = radio.stream;

    audioPlayer.load();


    // UI

    document
        .getElementById("radioName")
        .textContent = radio.name;


    const logo =
        document.getElementById("radioLogo");


    if(radio.logo){

        logo.src = radio.logo;

        logo.style.display = "inline-block";

    }else{

        logo.removeAttribute("src");

        logo.style.display = "none";

    }


    const web =
        document.getElementById("radioWeb");


    if(radio.web){

        web.href = radio.web;

        web.textContent =
            radio.web.replace(/^https?:\/\//,"");

        web.style.display = "inline-block";

    }else{

        web.style.display = "none";

    }


    document
        .getElementById("songTitle")
        .textContent = "Načítavam...";


    document
        .getElementById("artist")
        .textContent = "";


    document
        .getElementById("castMessage")
        .textContent = "";


    updateFavoriteButton();

    renderAllMenu();

    startMetadata();

    showProgram();


    if(shouldPlay){

        audioPlayer
            .play()
            .then(() => {

                document
                    .getElementById("playButton")
                    .textContent = "❚❚";

                document
                    .getElementById("playerStatus")
                    .textContent =
                    "Prehráva sa";

            })
            .catch(() => {

                document
                    .getElementById("playButton")
                    .textContent = "▶";

                document
                    .getElementById("playerStatus")
                    .textContent =
                    "Nové rádio sa nepodarilo spustiť";

            });

    }else{

        document
            .getElementById("playButton")
            .textContent = "▶";

        document
            .getElementById("playerStatus")
            .textContent =
            "Pripravené";

    }

}


// ======================================================
// PREHRÁVAČ
// ======================================================

function togglePlay(){

    if(audioPlayer.paused){

        audioPlayer
            .play()
            .then(() => {

                document
                    .getElementById("playButton")
                    .textContent = "❚❚";

                document
                    .getElementById("playerStatus")
                    .textContent =
                    "Prehráva sa";

            })
            .catch(() => {

                document
                    .getElementById("playerStatus")
                    .textContent =
                    "Stream sa nepodarilo spustiť";

            });

    }else{

        audioPlayer.pause();

        document
            .getElementById("playButton")
            .textContent = "▶";

        document
            .getElementById("playerStatus")
            .textContent =
            "Pozastavené";

    }

}


audioPlayer.addEventListener(
    "play",
    () => {

        document
            .getElementById("playButton")
            .textContent = "❚❚";

        document
            .getElementById("playerStatus")
            .textContent =
            "Prehráva sa";

    }
);


audioPlayer.addEventListener(
    "pause",
    () => {

        document
            .getElementById("playButton")
            .textContent = "▶";

    }
);


audioPlayer.addEventListener(
    "error",
    () => {

        document
            .getElementById("playerStatus")
            .textContent =
            "Chyba pri prehrávaní streamu";

    }
);


function changeVolume(value){

    audioPlayer.volume =
        Number(value);

}


// ======================================================
// OBĽÚBENÉ
// ======================================================

function renderFavorites(){

    const container =
        document.getElementById("favoritesList");

    container.innerHTML = "";


    if(!favorites.length){

        container.innerHTML =
            '<div class="empty">Zatiaľ nemáš obľúbené rádio.</div>';

        return;

    }


    favorites.forEach(radio => {

        const wrapper =
            document.createElement("div");


        wrapper.className =
            "favorite-item";


        wrapper.innerHTML = `
            <div
                onclick="selectFavoriteRadio('${escapeJs(radio.id)}')"
                style="cursor:pointer;">

                <span class="item-title">
                    📻 ${escapeHtml(radio.name)}
                </span>

                <span class="item-small">
                    ${radio.custom ? "Vlastné rádio" : "Rádio"}
                </span>

            </div>

            <button
                class="danger-button"
                type="button"
                onclick="removeFavorite('${escapeJs(radio.id)}')">

                Odstrániť

            </button>
        `;


        container.appendChild(wrapper);

    });

}


function selectFavoriteRadio(id){

    let radio =
        radios.find(
            item => item.id === id
        );


    if(!radio){

        radio =
            myRadios.find(
                item => item.id === id
            );

    }


    if(radio){

        selectRadio(radio);

    }

}


// ======================================================
// VLASTNÉ RÁDIÁ
// ======================================================

function renderMyRadios(){

    const container =
        document.getElementById("myRadiosList");


    if(!container) return;


    container.innerHTML = "";


    if(!myRadios.length){

        container.innerHTML =
            '<div class="empty">Zatiaľ nemáš pridané vlastné rádio.</div>';

        return;

    }


    myRadios.forEach(radio => {

        const wrapper =
            document.createElement("div");


        wrapper.className =
            "my-radio-item";


        wrapper.innerHTML = `
            <div
                onclick="selectMyRadio('${escapeJs(radio.id)}')"
                style="cursor:pointer;">

                <span class="item-title">
                    📡 ${escapeHtml(radio.name)}
                </span>

                <span class="item-small">
                    Kliknutím počúvať
                </span>

            </div>

            <button
                class="danger-button"
                type="button"
                onclick="deleteMyRadio('${escapeJs(radio.id)}')">

                Odstrániť

            </button>
        `;


        container.appendChild(wrapper);

    });

}


function selectMyRadio(id){

    const radio =
        myRadios.find(
            item => item.id === id
        );


    if(radio){

        selectRadio(radio);

    }

}


function deleteMyRadio(id){

    myRadios =
        myRadios.filter(
            radio => radio.id !== id
        );


    favorites =
        favorites.filter(
            radio => radio.id !== id
        );


    localStorage.setItem(
        "pocuvam_my_radios",
        JSON.stringify(myRadios)
    );


    localStorage.setItem(
        "pocuvam_favorites",
        JSON.stringify(favorites)
    );


    if(currentRadio.id === id){

        loadRadio(radios[0]);

    }


    renderAllMenu();

}


function renderAllMenu(){

    renderRadioList();

    renderRecommended();

    renderFavorites();

    renderMyRadios();

}


function selectRadio(radio){

    loadRadio(radio);

    closeSideMenu();

}


// ======================================================
// PRIDAŤ VLASTNÉ RÁDIO
// ======================================================

function addMyRadio(event){

    event.preventDefault();


    const name =
        document
            .getElementById("myRadioName")
            .value
            .trim();


    const stream =
        document
            .getElementById("myRadioStream")
            .value
            .trim();


    const web =
        document
            .getElementById("myRadioWeb")
            .value
            .trim();


    if(!name || !stream){

        return;

    }


    const radio = {

        id:
            "my-" +
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .slice(2),

        name,
        stream,
        web,
        logo:"",
        recommended:false,
        custom:true

    };


    myRadios.push(radio);


    localStorage.setItem(
        "pocuvam_my_radios",
        JSON.stringify(myRadios)
    );


    document
        .getElementById("myRadioName")
        .value = "";


    document
        .getElementById("myRadioStream")
        .value = "";


    document
        .getElementById("myRadioWeb")
        .value = "";


    renderMyRadios();


    document
        .getElementById("playerStatus")
        .textContent =
        "Rádio bolo pridané.";

}


// ======================================================
// NÁVRH RÁDIA
// ======================================================

function suggestRadio(event){

    event.preventDefault();


    const suggestion = {

        name:
            document
                .getElementById("suggestName")
                .value
                .trim(),

        stream:
            document
                .getElementById("suggestStream")
                .value
                .trim(),

        web:
            document
                .getElementById("suggestWeb")
                .value
                .trim(),

        note:
            document
                .getElementById("suggestNote")
                .value
                .trim(),

        date:
            new Date().toISOString()

    };


    suggestions.push(suggestion);


    localStorage.setItem(
        "pocuvam_suggestions",
        JSON.stringify(suggestions)
    );


    event.target.reset();


    document
        .getElementById("suggestMessage")
        .textContent =
        "Návrh bol uložený v tomto zariadení.";

}


// ======================================================
// PROGRAM Z FIREBASE
// ======================================================

async function showProgram(){

    const date =
        document
            .getElementById("programDate")
            .value;


    const container =
        document
            .getElementById("programContent");


    if(!date){

        container.textContent =
            "Vyber dátum programu.";

        return;

    }


    if(!currentRadio){

        container.textContent =
            "Rádio nie je vybrané.";

        return;

    }


    const requestId =
        ++programRequestId;


    container.textContent =
        "Načítavam program...";


    try{

        const snapshot =
            await database
                .ref(
                    `programs/${currentRadio.id}/${date}`
                )
                .once("value");


        if(requestId !== programRequestId){

            return;

        }


        const entries =
            snapshot.val();


        if(
            !entries ||
            !Array.isArray(entries) ||
            !entries.length
        ){

            container.textContent =
                "Pre toto rádio a tento dátum program zatiaľ nie je dostupný.";

            return;

        }


        container.innerHTML =
            entries
                .map(item => `

                    <div class="program-row">

                        <div class="program-time">
                            ${escapeHtml(item.time || "")}
                        </div>

                        <div>

                            <div class="program-name">
                                ${escapeHtml(item.name || "")}
                            </div>

                            <div class="program-radio-name">
                                ${escapeHtml(currentRadio.name)}
                            </div>

                        </div>

                    </div>

                `)
                .join("");


    }catch(error){

        console.error(
            "Firebase program:",
            error
        );


        container.textContent =
            "Program sa nepodarilo načítať.";

    }

}


// ======================================================
// METADATA
// ======================================================

function normalizeMetadata(data){

    if(!data){

        return {
            title:"",
            artist:""
        };

    }


    return {

        title:
            String(
                data.title ||
                data.song ||
                data.track ||
                ""
            ),

        artist:
            String(
                data.artist ||
                data.performer ||
                ""
            )

    };

}


function displayMetadata(data,radioId){

    if(
        !currentRadio ||
        currentRadio.id !== radioId
    ){

        return;

    }


    const metadata =
        normalizeMetadata(data);


    document
        .getElementById("songTitle")
        .textContent =
        metadata.title ||
        "Práve hrá";


    document
        .getElementById("artist")
        .textContent =
        metadata.artist;


    if(
        window.PocuvamRadiaCast &&
        typeof window.PocuvamRadiaCast.updateMetadata === "function"
    ){

        window.PocuvamRadiaCast
            .updateMetadata(
                metadata.title,
                metadata.artist
            );

    }

}


function loadMetadata(){

    if(!currentRadio){

        return;

    }


    const radioId =
        currentRadio.id;


    metadataRef
        .child(radioId)
        .once("value")

        .then(snapshot => {

            if(
                currentRadio &&
                currentRadio.id === radioId
            ){

                const data =
                    snapshot.val();


                metadataCache[radioId] =
                    data;


                displayMetadata(
                    data,
                    radioId
                );

            }

        })

        .catch(error => {

            console.error(
                "Firebase metadata:",
                error
            );


            if(
                currentRadio &&
                currentRadio.id === radioId
            ){

                document
                    .getElementById("songTitle")
                    .textContent =
                    "Metadata nie sú dostupné";

            }

        });

}


function startMetadata(){

    if(metadataTimer){

        clearInterval(metadataTimer);

    }


    loadMetadata();


    metadataTimer =
        setInterval(
            loadMetadata,
            15000
        );

}


// ======================================================
// DÁTUM
// ======================================================

function getLocalDate(){

    const now =
        new Date();


    const year =
        now.getFullYear();


    const month =
        String(
            now.getMonth() + 1
        ).padStart(2,"0");


    const day =
        String(
            now.getDate()
        ).padStart(2,"0");


    return `${year}-${month}-${day}`;

}


// ======================================================
// SPUSTENIE
// ======================================================

function initializeApp(){

    audioPlayer.volume = 1;


    document
        .getElementById("programDate")
        .value =
        getLocalDate();


    renderAllMenu();


    loadRadio(
        radios[0]
    );


    showProgram();

}


initializeApp();

</script>
